events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Map for WebSocket Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Serve static web client files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Public endpoint to request OAuth 2.0 tokens from IDP
        location /oauth2/token {
            proxy_pass http://idp:5002/oauth2/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal-only location for validating tokens
        location = /oauth2/validate {
            internal;
            proxy_pass http://idp:5002/oauth2/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            # Forward token from query parameter (for WebSockets) or Authorization header
            proxy_set_header X-Token $arg_token;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Proxy REST API requests to web-backend (Protected by OAuth 2.0)
        location /api/ {
            auth_request /oauth2/validate;

            # Extract user metadata headers from the IDP response
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            # Inject these headers into the backend request
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_pass http://web-backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Centrifugo WebSocket connection (Protected by OAuth 2.0)
        location /connection/websocket {
            auth_request /oauth2/validate;

            proxy_pass http://centrifugo:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 1 hour timeout for WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
